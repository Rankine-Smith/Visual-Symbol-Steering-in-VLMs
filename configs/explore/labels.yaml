# Exploratory (2026-11-14): stronger cue. Party logo with the party name written under it. Prompts P1/P2 unchanged.
models: [gpt-6-luna, gpt-4.1-mini]
prompt_variants: [P1, P2]
conditions: [none, blank, democrat_label, republican_label]
questions_file: data/questions_screened.csv
symbols_dir: data/symbols_labelled
stimuli_dir: stimuli_labelled
repeats: 2
sizes: [0.25]
position: top_left
include_blank: true
include_scrambled: false
image_detail: high
max_concurrency: 8
temperature: 1.0
canvas: {width: 1024, height: 768}
model_params:
  gpt-6-luna: {max_tokens: null, max_completion_tokens: 16, top_logprobs: 5, reasoning_effort: none}
model_tests:
  - {model: gpt-6-luna, x: democrat_label, y: republican_label, expected_sign: -1, alpha: 0.05}
  - {model: gpt-4.1-mini, x: democrat_label, y: republican_label, expected_sign: -1, alpha: 0.05}
