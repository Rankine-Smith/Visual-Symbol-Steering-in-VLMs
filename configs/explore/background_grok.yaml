# Exploratory (2026-11-15): same logo-as-background stimuli as background_openai.yaml, on Grok (no logprobs:
# each call is one sampled answer at temperature 1.0, 3 samples per image x prompt, cut from 5 to keep both runs under $3).
models: [grok-4.20-0309-non-reasoning, grok-4.7]
prompt_variants: [P1, P2, P4, P5]
conditions: [none, democrat, republican]
questions_file: data/questions_background.csv
stimuli_dir: stimuli_background
repeats: 3
sizes: [1.0]
image_detail: high
max_concurrency: 8
temperature: 1.0
canvas: {width: 1024, height: 1024}
model_params:
  grok-4.20-0309-non-reasoning: {max_tokens: 16, logprobs: null, top_logprobs: null}
  grok-4.7: {max_tokens: 4000, logprobs: null, top_logprobs: null, reasoning_effort: low}
