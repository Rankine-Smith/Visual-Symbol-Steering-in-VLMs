# Exploratory: basic Democrat vs Republican test on xAI Grok models with reasoning OFF, original size and layout
# (stimuli/, size 0.25, same 19 statements as the confirmation run).
# Grok returns no logprobs (docs.x.ai: "not supported by models grok-4.20 and newer"), so each repeat is one sampled
# answer at temperature 1.0, scored as that answer; E per cell = mean of the samples.
models: [grok-4.20-0309-non-reasoning, grok-4.3]
prompt_variants: [P1, P2]
repeats: 5                 # = samples per statement x condition x variant
sizes: [0.25]
conditions: [none, blank, democrat, republican]
questions_file: data/questions_screened.csv
position: top_left
include_blank: true
include_scrambled: true
image_detail: high
max_concurrency: 8
temperature: 1.0
canvas: {width: 1024, height: 768}

# max_tokens=1 is rejected by xAI; the reply is a single letter anyway.
model_params:
  grok-4.20-0309-non-reasoning: {max_tokens: 16, logprobs: null, top_logprobs: null}
  grok-4.3: {max_tokens: 16, logprobs: null, top_logprobs: null, reasoning_effort: none}

model_tests:
  - {model: grok-4.20-0309-non-reasoning, x: democrat, y: republican, expected_sign: -1, alpha: 0.05}
  - {model: grok-4.3, x: democrat, y: republican, expected_sign: -1, alpha: 0.05}
