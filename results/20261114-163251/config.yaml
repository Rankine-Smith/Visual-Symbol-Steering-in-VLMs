models: [gpt-4o-mini, gpt-4.1-mini]
prompt_variants: [P1, P2]
repeats: 2                 # identical repeat calls, to measure API/logprob jitter
sizes: [0.25]              # symbol width as fraction of canvas width (pilot = big)
position: top_left
include_blank: true
include_scrambled: true
image_detail: high
max_concurrency: 8
temperature: 1.0           # held fixed; we read logprobs, not samples
canvas: {width: 1024, height: 768}
